<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="LVS — проверенные задания и информация из реального мира.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="LVS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>LVS</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- Inside Telegram: the Mini App's frame, back button, links and the
       device key in Telegram's secure storage (iOS and Android). Opened in a
       plain browser, all of it stays off and browser storage is used. -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    (() => {
      const tg = window.Telegram && window.Telegram.WebApp;
      const inTelegram = !!(tg && tg.initData);
      const query = new URLSearchParams(location.search);
      // app.lvs.network in a plain browser: the full website is lvs.network.
      if (location.hostname === 'app.lvs.network' && !inTelegram &&
          !/tgWebApp/.test(location.hash + location.search) &&
          query.get('stay') !== '1' && query.get('preview') !== 'app') {
        window.lvsLeaving = true;
        location.replace('https://lvs.network/' + (location.hash || ''));
        return;
      }
      // Telegram's launch data is read; the address is the app's again.
      if (/tgWebApp/.test(location.hash)) {
        history.replaceState(null, '', location.pathname + location.search);
      }
      let onBack = null;
      window.lvsTelegram = {
        inTelegram,
        colors(hex) {
          if (!inTelegram) return;
          try {
            tg.setHeaderColor(hex);
            tg.setBackgroundColor(hex);
            if (tg.setBottomBarColor) tg.setBottomBarColor(hex);
          } catch (_) {}
        },
        // Web links open in Telegram's browser, t.me links inside Telegram.
        open(url) {
          if (!inTelegram || !/^https:\/\//.test(url)) return false;
          if (/^https:\/\/t\.me\//.test(url)) tg.openTelegramLink(url);
          else tg.openLink(url);
          return true;
        },
        back(show, handler) {
          if (!inTelegram) return;
          if (onBack) tg.BackButton.offClick(onBack);
          onBack = handler || null;
          if (onBack) tg.BackButton.onClick(onBack);
          if (show) tg.BackButton.show(); else tg.BackButton.hide();
        },
      };
      if (inTelegram) {
        tg.ready();
        tg.expand();
        if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
      }

      // The device key: Telegram's secure storage where the phone has it,
      // otherwise browser storage. One item holds the key of every network.
      const item = 'lvs_device_secrets';
      const keys = { secure: false, map: {} };
      const answer = (ask) => new Promise((resolve) => {
        setTimeout(() => resolve(null), 4000);
        try { ask(resolve); } catch (_) { resolve(null); }
      });
      window.lvsSecretsReady = (async () => {
        const storage = inTelegram && tg.isVersionAtLeast('9.0') ? tg.SecureStorage : null;
        if (!storage) return;
        const read = await answer((done) => storage.getItem(item,
          (error, value, canRestore) => done({ error, value, canRestore })));
        // No answer or an error: this Telegram (for PC) has no secure storage.
        if (!read || read.error) return;
        let value = read.value;
        if (!value && read.canRestore) {
          const restored = await answer((done) => storage.restoreItem(item,
            (error, saved) => done({ error, value: saved })));
          value = restored && !restored.error ? restored.value : null;
        }
        try { keys.map = value ? JSON.parse(value) : {}; } catch (_) { keys.map = {}; }
        keys.secure = true;
      })();
      window.lvsSecrets = {
        get(name) {
          if (!keys.secure) return localStorage.getItem(name);
          const old = localStorage.getItem(name);
          // A key kept by this browser before: it moves to Telegram's storage.
          if (keys.map[name] == null && old) window.lvsSecrets.set(name, old);
          return keys.map[name] == null ? null : keys.map[name];
        },
        remove(name) {
          localStorage.removeItem(name);
          if (!keys.secure || keys.map[name] == null) return;
          delete keys.map[name];
          tg.SecureStorage.setItem(item, JSON.stringify(keys.map));
        },
        set(name, value) {
          if (!keys.secure) { localStorage.setItem(name, value); return; }
          keys.map[name] = value;
          tg.SecureStorage.setItem(item, JSON.stringify(keys.map), (error) => {
            // Kept in the browser only while Telegram did not take it.
            if (error) localStorage.setItem(name, value);
            else localStorage.removeItem(name);
          });
        },
      };
    })();
  </script>
  <!-- The Mini App's LVS core (WebAssembly, built from web-core) starts
       first; the app's screens find it as window.lvsCore. -->
  <script type="module">
    if (!window.lvsLeaving) {
      const { default: init, openRuntime, callRuntime, closeRuntime, call } =
        await import('./lvs_core/lvs_core.js');
      await Promise.all([init(), window.lvsSecretsReady]);
      window.lvsCore = { openRuntime, callRuntime, closeRuntime, call };
      const flutter = document.createElement('script');
      flutter.src = 'flutter_bootstrap.js';
      document.body.appendChild(flutter);
    }
  </script>
</body>
</html>
