<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<title>LVS — задания рядом, оплата за результат</title>
<meta name="description" content="LVS: делайте реальные дела рядом с вами и получайте оплату за доказанный результат.">
<link rel="icon" href="lvs-orbit.png">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#070b14;--s1:#0e1526;--s2:#141d33;--line:rgba(255,255,255,.07);--tx:#e9eefc;--mu:#8793b5;--ac:#4f8cff;--ac2:#22d3ee;--vi:#7c5cff;--bon:#fbbf24;--ok:#34d399;--r:18px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:var(--bg);color-scheme:dark}
body{background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(60% 40% at 85% -5%,rgba(79,140,255,.22),transparent 70%),radial-gradient(50% 35% at -5% 30%,rgba(124,92,255,.14),transparent 70%),radial-gradient(40% 30% at 70% 100%,rgba(34,211,238,.10),transparent 70%)}
svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1,h2,h3{line-height:1.15;letter-spacing:-.02em}
a{color:inherit}
.mu{color:var(--mu)}
.grad{background:linear-gradient(120deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.card{background:linear-gradient(180deg,var(--s2),var(--s1));border:1px solid var(--line);border-radius:var(--r);padding:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 20px;font:600 15px/1 inherit;color:#fff;background:linear-gradient(135deg,var(--ac),var(--vi));cursor:pointer;text-decoration:none;box-shadow:0 8px 24px rgba(79,140,255,.28)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--s2);border:1px solid var(--line);box-shadow:none}
.btn.block{width:100%}
.btn svg{width:18px;height:18px}
.ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:rgba(79,140,255,.14);color:var(--ac);flex:none}
.ic.c2{background:rgba(34,211,238,.14);color:var(--ac2)}
.ic.c3{background:rgba(124,92,255,.16);color:#a794ff}
.ic.c4{background:rgba(251,191,36,.14);color:var(--bon)}
.ic.c5{background:rgba(52,211,153,.14);color:var(--ok)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:600;background:rgba(52,211,153,.14);color:var(--ok)}
.chip.gold{background:rgba(251,191,36,.16);color:var(--bon)}
.chip svg{width:14px;height:14px}

/* ---------- Mini App ---------- */
body.web .app{display:none}
body.tg .web{display:none}
.app{max-width:520px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom));position:relative}
.tab{display:flex;flex-direction:column;gap:14px;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.top{display:flex;align-items:center;gap:12px}
.ava{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--vi));display:grid;place-items:center;font-weight:700;font-size:18px;overflow:hidden;flex:none}
.ava img{width:100%;height:100%;object-fit:cover}
.top h2{font-size:19px}
.top .sub{font-size:13px;color:var(--mu)}
.bal{position:relative;overflow:hidden;border-radius:22px;padding:20px;background:linear-gradient(135deg,#1a3a94 0%,#0f5f86 55%,#0e1c36 100%);border:1px solid rgba(255,255,255,.12);box-shadow:0 18px 50px rgba(34,211,238,.12)}
.bal::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(34,211,238,.45),transparent 70%)}
.bal>*{position:relative;z-index:1}
.bal .lab{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.bal .big{font-size:44px;font-weight:800;letter-spacing:-.03em;margin:6px 0 4px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.bal .big small{font-size:18px;font-weight:700;color:var(--bon)}
.bal p{font-size:13px;opacity:.85;margin-bottom:14px;max-width:34ch}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px;border-radius:16px;background:var(--s1);border:1px solid var(--line);font:600 13px/1.2 inherit;color:var(--tx);cursor:pointer}
.tile:active{transform:scale(.97)}
h3.sec{font-size:17px;margin-top:6px}
.steps{display:flex;flex-direction:column;gap:12px}
.step{display:flex;gap:14px;align-items:flex-start}
.step .n{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#04101f;flex:none}
.step b{display:block;font-size:15px}
.step span{font-size:13px;color:var(--mu)}
.hs{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:2px 16px 4px;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.hs .card{min-width:150px;display:flex;flex-direction:column;gap:10px}
.hs b{font-size:14px}
.hs span{font-size:12px;color:var(--mu)}
.row{display:flex;align-items:center;gap:12px}
.row .grow{flex:1;min-width:0}
.row b{display:block;font-size:15px}
.row span.d{font-size:13px;color:var(--mu)}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--mu)}
.who{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:22px 16px}
.who .ava{width:84px;height:84px;font-size:34px;box-shadow:0 0 0 4px rgba(79,140,255,.25)}
.who h2{font-size:22px}
.idbox{display:inline-flex;gap:8px;align-items:center;padding:6px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-size:13px;color:var(--mu);cursor:pointer}
.idbox svg{width:14px;height:14px}
.link{display:flex;gap:8px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--bg);border:1px dashed rgba(255,255,255,.18);font-size:13px;word-break:break-all;color:var(--ac2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{text-align:center}
.stat b{font-size:28px;display:block}
.stat span{font-size:12px;color:var(--mu)}
.hero-friends{text-align:center;padding:26px 16px;background:linear-gradient(135deg,rgba(251,191,36,.16),rgba(124,92,255,.14));border:1px solid rgba(251,191,36,.25);border-radius:22px}
.hero-friends .big{font-size:42px;font-weight:800;color:var(--bon);letter-spacing:-.03em}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;justify-content:center;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:rgba(7,11,20,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.tabbar .in{display:flex;width:100%;max-width:520px}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;background:none;border:0;color:var(--mu);font:600 11px/1 inherit;cursor:pointer;position:relative}
.tabbar button.on{color:var(--ac)}
.tabbar button.on::before{content:"";position:absolute;top:-9px;width:26px;height:3px;border-radius:0 0 4px 4px;background:linear-gradient(90deg,var(--ac),var(--ac2))}
.skel{height:44px;border-radius:12px;background:linear-gradient(90deg,rgba(255,255,255,.06),rgba(255,255,255,.12),rgba(255,255,255,.06));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#fff;color:#07101f;padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:50}
.toast.on{opacity:1;transform:translateX(-50%)}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.lang button{background:none;border:0;color:var(--mu);padding:7px 11px;font:700 12px/1 inherit;cursor:pointer}
.lang button.on{background:var(--s2);color:var(--tx)}

/* ---------- Website ---------- */
.wrap{max-width:1080px;margin:0 auto;padding:0 20px;position:relative}
.nav{display:flex;align-items:center;justify-content:space-between;padding:18px 0}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.02em;text-decoration:none}
.logo img{width:34px;height:34px;border-radius:10px}
.nav .right{display:flex;align-items:center;gap:10px}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding:36px 0 70px}
.hero h1{font-size:clamp(34px,5.2vw,58px);font-weight:800;margin-bottom:18px}
.hero p.lead{font-size:18px;color:var(--mu);max-width:46ch;margin-bottom:26px}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap}
.hero .btn{padding:16px 26px;font-size:16px}
.stage{display:flex;justify-content:center;position:relative}
.stage::before{content:"";position:absolute;inset:8% 4%;border-radius:50%;background:radial-gradient(circle,rgba(34,211,238,.28),transparent 68%);filter:blur(10px)}
.phone{width:282px;height:560px;border-radius:42px;border:9px solid #1a2342;background:var(--bg);overflow:hidden;position:relative;box-shadow:0 40px 90px rgba(79,140,255,.25),inset 0 0 0 1px rgba(255,255,255,.06);transform:rotate(3deg)}
.phone .screen{padding:26px 14px 0;display:flex;flex-direction:column;gap:12px;pointer-events:none}
.phone .bal{padding:16px}
.phone .bal .big{font-size:36px}
.phone .bal p{font-size:12px;margin-bottom:0}
.phone .tiles .tile{padding:10px 4px;font-size:11px}
.phone .tiles .ic{width:34px;height:34px;border-radius:11px}
.phone .tiles svg{width:18px;height:18px}
.phone .tb{position:absolute;left:0;right:0;bottom:0;display:flex;padding:10px 8px 14px;background:rgba(14,21,38,.95);border-top:1px solid var(--line)}
.phone .tb span{flex:1;text-align:center;font-size:10px;color:var(--mu);font-weight:600}
.phone .tb span.on{color:var(--ac)}
.phone .tb svg{width:20px;height:20px;display:block;margin:0 auto 3px}
.sectionW{padding:60px 0}
.sectionW>h2,.cta-band h2{font-size:clamp(26px,3.6vw,38px);margin-bottom:10px;font-weight:800}
.sectionW>p.sub{color:var(--mu);margin-bottom:28px;max-width:60ch}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.feat{display:flex;flex-direction:column;gap:12px;padding:22px}
.feat h3{font-size:18px}
.feat p{color:var(--mu);font-size:14px}
.num{font-size:44px;font-weight:800;letter-spacing:-.04em}
.cur{padding:26px}
.cur h3{font-size:22px;margin:10px 0 8px}
.cur p{color:var(--mu)}
.cta-band{margin:40px 0 60px;text-align:center;padding:48px 20px;border-radius:28px;background:linear-gradient(135deg,rgba(79,140,255,.22),rgba(124,92,255,.18));border:1px solid rgba(255,255,255,.1)}
.cta-band p{color:var(--mu);margin-bottom:22px}
footer.fw{padding:28px 0 40px;color:var(--mu);font-size:13px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
@media(max-width:860px){
  .hero{grid-template-columns:1fr;padding:18px 0 50px;gap:30px}
  .grid3,.grid4{grid-template-columns:1fr 1fr}
  .grid2{grid-template-columns:1fr}
}
@media(max-width:560px){
  .grid3,.grid4{grid-template-columns:1fr}
  .hero .cta .btn{flex:1}
  .nav .btn{display:none}
  .phone{transform:none}
}
</style>
</head>
<body>

<!-- ================= Mini App ================= -->
<div class="app">

  <section class="tab" data-tab="home">
    <div class="top">
      <div class="ava" data-ava></div>
      <div><h2 id="hello"></h2><div class="sub" data-i="brand_tag"></div></div>
    </div>

    <div class="bal">
      <div class="lab" data-i="bal_label"></div>
      <div id="balBox"><div class="skel"></div></div>
    </div>

    <div class="tiles">
      <button class="tile" data-go="tasks"><span class="ic c2"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M3.5 6l1.5 1.5L7 5M3.5 12l1.5 1.5L7 11M3.5 18l1.5 1.5L7 17"/></svg></span><span data-i="q_tasks"></span></button>
      <button class="tile" data-go="friends"><span class="ic c4"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18.5 14.4c1.9.8 3 2.7 3 5.6"/></svg></span><span data-i="q_friends"></span></button>
      <button class="tile" data-bot="app"><span class="ic c3"><svg viewBox="0 0 24 24"><rect x="6" y="2.5" width="12" height="19" rx="3"/><path d="M10.5 18.5h3"/></svg></span><span data-i="q_app"></span></button>
    </div>

    <h3 class="sec" data-i="how_t"></h3>
    <div class="card steps">
      <div class="step"><div class="n">1</div><div><b data-i="s1_t"></b><span data-i="s1_d"></span></div></div>
      <div class="step"><div class="n">2</div><div><b data-i="s2_t"></b><span data-i="s2_d"></span></div></div>
      <div class="step"><div class="n">3</div><div><b data-i="s3_t"></b><span data-i="s3_d"></span></div></div>
    </div>

    <h3 class="sec" data-i="do_t"></h3>
    <div class="hs">
      <div class="card"><span class="ic"><svg viewBox="0 0 24 24"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></span><b data-i="d1"></b><span data-i="d1d"></span></div>
      <div class="card"><span class="ic c5"><svg viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg></span><b data-i="d2"></b><span data-i="d2d"></span></div>
      <div class="card"><span class="ic c3"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="3"/><path d="M16 10.5l5-3v9l-5-3"/></svg></span><b data-i="d3"></b><span data-i="d3d"></span></div>
      <div class="card"><span class="ic c4"><svg viewBox="0 0 24 24"><path d="M4 4h7l9 9-7 7-9-9z"/><circle cx="8.5" cy="8.5" r="1.2"/></svg></span><b data-i="d4"></b><span data-i="d4d"></span></div>
    </div>
  </section>

  <section class="tab" data-tab="tasks" hidden>
    <div><h2 style="font-size:26px" data-i="tk_t"></h2><div class="mu" data-i="tk_sub"></div></div>
    <div class="card row"><span class="ic c2"><svg viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg></span><div class="grow"><b data-i="tk_w_t"></b><span class="d" data-i="tk_w_d"></span></div></div>
    <div class="card row"><span class="ic c3"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span><div class="grow"><b data-i="tk_c_t"></b><span class="d" data-i="tk_c_d"></span></div></div>
    <h3 class="sec" data-i="cur_t"></h3>
    <div class="card row"><span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 8l4 8 4-8"/></svg></span><div class="grow"><b>VU</b><span class="d" data-i="vu_d"></span></div></div>
    <div class="card row"><span class="ic c4"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 8h4a2 2 0 0 1 0 4H9m0 0h5a2 2 0 0 1 0 4H9V8"/></svg></span><div class="grow"><b>BON</b><span class="d" data-i="bon_d"></span></div></div>
    <div class="card" style="text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;padding:22px 16px">
      <span class="ic c3" style="width:54px;height:54px"><svg viewBox="0 0 24 24"><rect x="6" y="2.5" width="12" height="19" rx="3"/><path d="M10.5 18.5h3"/></svg></span>
      <b style="font-size:17px" data-i="app_t"></b>
      <span class="mu" style="font-size:13px" data-i="app_d"></span>
      <button class="btn block" data-bot="app"><span data-i="app_btn"></span></button>
    </div>
  </section>

  <section class="tab" data-tab="friends" hidden>
    <div class="hero-friends">
      <div class="big">+1 BON</div>
      <div data-i="fr_sub"></div>
    </div>
    <div class="two" id="frStats" hidden>
      <div class="card stat"><b id="stInv">0</b><span data-i="fr_inv"></span></div>
      <div class="card stat"><b id="stOk">0</b><span data-i="fr_ok"></span></div>
    </div>
    <div class="card" id="frLinkCard" style="display:flex;flex-direction:column;gap:12px"></div>
    <h3 class="sec" data-i="how_t"></h3>
    <div class="card steps">
      <div class="step"><div class="n">1</div><div><b data-i="f1_t"></b><span data-i="f1_d"></span></div></div>
      <div class="step"><div class="n">2</div><div><b data-i="f2_t"></b><span data-i="f2_d"></span></div></div>
      <div class="step"><div class="n">3</div><div><b data-i="f3_t"></b><span data-i="f3_d"></span></div></div>
    </div>
    <div class="mu" style="font-size:13px" data-i="fr_note"></div>
  </section>

  <section class="tab" data-tab="me" hidden>
    <div class="card who">
      <div class="ava" data-ava></div>
      <h2 id="meName"></h2>
      <div class="mu" id="meUser"></div>
      <div class="idbox" id="meId" data-copy=""><span id="meIdTxt"></span><svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/></svg></div>
    </div>
    <div class="card">
      <div class="kv"><span class="k" data-i="pr_phone"></span><span id="mePhone"></span></div>
      <div class="kv"><span class="k">BON</span><b id="meBon">—</b></div>
      <div class="kv"><span class="k" data-i="pr_lang"></span>
        <span class="lang"><button data-lang="ru">RU</button><button data-lang="en">EN</button></span></div>
    </div>
    <div class="two">
      <a class="btn ghost" href="https://lvs.network" target="_blank" rel="noopener"><span data-i="pr_site"></span></a>
      <button class="btn ghost" data-bot=""><span data-i="pr_bot"></span></button>
    </div>
    <div class="mu" style="text-align:center;font-size:12px" data-i="pr_ver"></div>
  </section>

</div>

<nav class="tabbar" style="display:none" id="tabbar"><div class="in">
  <button data-go="home" class="on"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span data-i="tb_home"></span></button>
  <button data-go="tasks"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M3.5 6l1.5 1.5L7 5M3.5 12l1.5 1.5L7 11M3.5 18l1.5 1.5L7 17"/></svg><span data-i="tb_tasks"></span></button>
  <button data-go="friends"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18.5 14.4c1.9.8 3 2.7 3 5.6"/></svg><span data-i="tb_friends"></span></button>
  <button data-go="me"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg><span data-i="tb_me"></span></button>
</div></nav>
<div class="toast" id="toast"></div>

<!-- ================= Website ================= -->
<div class="web">
  <div class="wrap">
    <header class="nav">
      <a class="logo" href="/"><img src="lvs-orbit.png" alt="">LVS</a>
      <div class="right">
        <span class="lang"><button data-lang="ru">RU</button><button data-lang="en">EN</button></span>
        <a class="btn" data-bot="" href="https://t.me/LVSNetworkBot"><span data-i="w_cta"></span></a>
      </div>
    </header>

    <section class="hero">
      <div>

const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const user=(inTg&&tg.initDataUnsafe&&tg.initDataUnsafe.user)||(preview?{id:123456789,first_name:'Demo',username:'demo',language_code:'ru'}:null);
const pick=l=>/^(ru|be|kk|uk)/i.test(l||'')?'ru':'en';
let lang=store.get('lvs_lang')||pick((user&&user.language_code)||navigator.language);
const t=k=>(T[lang]&&T[lang][k])||T.en[k]||k;

const startParam=((inTg&&tg.initDataUnsafe&&tg.initDataUnsafe.start_param)||q.get('ref')||'').replace(/^ref_/,'');
const refCode=/^[A-Za-z0-9_-]{4,40}$/.test(startParam)?startParam:'';
const botUrl=(payload)=>'https://t.me/'+BOT+(payload?'?start='+payload:'');
const botStart=()=>botUrl(refCode?'ref_'+refCode:'');
const $=s=>document.querySelector(s);
const $$=s=>[].slice.call(document.querySelectorAll(s));
let me=null;

function openUrl(url){
  if(inTg&&tg.openTelegramLink&&/^https:\/\/t\.me\//.test(url)){tg.openTelegramLink(url)}
  else{window.open(url,'_blank','noopener')}
}
function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1600)}
function haptic(){try{tg.HapticFeedback.selectionChanged()}catch(e){}}
function copy(text){
  const done=()=>toast(t('copied'));
  function fallback(){const a=document.createElement('textarea');a.value=text;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove();done()}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done,fallback)}else fallback();
}
const bonText=a=>{const v=a/1e6;return (Math.round(v*100)/100).toString()};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function applyLang(){
  document.documentElement.lang=lang;
  $$('[data-i]').forEach(el=>{el.textContent=t(el.dataset.i)});
  $$('[data-lang]').forEach(b=>b.classList.toggle('on',b.dataset.lang===lang));
  if(appMode)renderAll();
}
function renderAva(){
  const first=(user&&user.first_name)||'L';
  $$('[data-ava]').forEach(e=>{
    e.textContent='';
    if(user&&user.photo_url){const i=new Image();i.src=user.photo_url;i.alt='';i.onerror=()=>{e.textContent=first[0].toUpperCase()};e.appendChild(i)}
    else e.textContent=first[0].toUpperCase();
  });
}
function renderHome(){
  $('#hello').textContent=t('hello').replace('{n}',(user&&user.first_name)||'');
  const box=$('#balBox');
  if(me&&me.verified){
    box.innerHTML='<div class="big">'+bonText(me.bon_atoms||0)+' <small>BON</small></div><p>'+esc(t('bal_note'))+'</p><span class="chip"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'+esc(t('ok_chip'))+'</span>';
  }else{
    box.innerHTML='<div class="big">10 <small>BON</small> <span class="chip gold">'+esc(t('gift_badge'))+'</span></div><p>'+esc(t('gift_text'))+'</p><button class="btn block" data-open="'+esc(botStart())+'">'+esc(t('gift_btn'))+'</button>';
  }
}
function renderFriends(){
  const c=$('#frLinkCard');
  const link=me&&me.invite_link;
  $('#frStats').hidden=!(me&&me.verified);
  if(me&&me.verified){$('#stInv').textContent=me.invited||0;$('#stOk').textContent=me.confirmed||0}
  if(link){
    c.innerHTML='<b>'+esc(t('fr_link'))+'</b><div class="link">'+esc(link)+'</div><div class="two"><button class="btn ghost" data-copy="'+esc(link)+'">'+esc(t('fr_copy'))+'</button><button class="btn" data-share="'+esc(link)+'">'+esc(t('fr_share'))+'</button></div>';
  }else{
    c.innerHTML='<b>'+esc(t('fr_link'))+'</b><span class="mu" style="font-size:13px">'+esc(t('fr_nolink'))+'</span><button class="btn block" data-open="'+esc(botStart())+'">'+esc(t('fr_open'))+'</button>';
  }
}
function renderProfile(){
  const u=user||{};
  $('#meName').textContent=[u.first_name,u.last_name].filter(Boolean).join(' ')||'LVS';
  $('#meUser').textContent=u.username?'@'+u.username:'';
  $('#meIdTxt').textContent=u.id?'ID: '+u.id:'';
  $('#meId').dataset.copy=u.id?String(u.id):'';
  $('#meId').hidden=!u.id;
  const ph=$('#mePhone');
  if(me&&me.verified){ph.innerHTML='<span class="chip"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'+esc(t('pr_ph_ok'))+'</span>'}
  else if(me){ph.textContent=t('pr_ph_no')}
  else{ph.textContent=t('pr_ph_unk')}
  $('#meBon').textContent=me?bonText(me.bon_atoms||0):'—';
}
function renderAll(){renderAva();renderHome();renderFriends();renderProfile()}

function go(tab){
  $$('.tab').forEach(s=>{s.hidden=s.dataset.tab!==tab});
  $$('#tabbar button').forEach(b=>b.classList.toggle('on',b.dataset.go===tab));
  window.scrollTo(0,0);haptic();
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-go],[data-open],[data-bot],[data-copy],[data-share],[data-lang]');
  if(!el)return;
  if(el.dataset.lang){lang=el.dataset.lang;store.set('lvs_lang',lang);applyLang();return}
  if(el.dataset.go!==undefined){go(el.dataset.go);return}
  if(el.dataset.open){openUrl(el.dataset.open);return}
  if(el.dataset.bot!==undefined){
    if(el.tagName==='A')e.preventDefault();
    openUrl(el.dataset.bot==='app'?botUrl('app'):botStart());return}
  if(el.dataset.copy){copy(el.dataset.copy);return}
  if(el.dataset.share){
    const text=lang==='ru'?'Заходи в LVS — задания рядом, оплата за результат. Тебе подарок: 10 BON.':'Join LVS — tasks nearby, paid for the result. A gift for you: 10 BON.';
    openUrl('https://t.me/share/url?url='+encodeURIComponent(el.dataset.share)+'&text='+encodeURIComponent(text));
  }
});

async function loadMe(){
  if(!inTg)return;
  try{
    const c=new AbortController();const to=setTimeout(()=>c.abort(),6000);
    const r=await fetch(API+'/blob/bonus/miniapp/me',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({init_data:tg.initData}),signal:c.signal});
    clearTimeout(to);
    if(!r.ok)throw new Error(r.status);
    me=await r.json();
  }catch(e){me=null}
  renderAll();
}

if(appMode){
  $('#tabbar').style.display='flex';
  if(tg){try{tg.ready();tg.expand();tg.setHeaderColor('#070b14');tg.setBackgroundColor('#070b14');if(tg.setBottomBarColor)tg.setBottomBarColor('#070b14')}catch(e){}}
}
applyLang();
loadMe();
})();
