<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060A14">
<title>LVS — задания рядом, оплата за результат</title>
<meta name="description" content="LVS: делайте реальные дела рядом с вами и получайте оплату за доказанный результат.">
<link rel="icon" href="img/orbit.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap&subset=cyrillic" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
:root{
  --bg0:#060A14;--bg1:#0A1020;--bg2:#000;
  --glass:rgba(255,255,255,.08);--stroke:rgba(255,255,255,.14);
  --tx:#fff;--tx2:rgba(255,255,255,.85);--tx3:rgba(255,255,255,.6);
  --accent:#1F6FEB;--blue:#5B8CFF;--mint:#31D6A3;--orange:#FFA54B;--violet:#7B6BFF;--red:#FF5E6C;--gold:#D8AF63;--crim:#9E2D1E;
  --deep:#141c30;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:var(--bg2);color-scheme:dark}
body{background:linear-gradient(180deg,var(--bg0),var(--bg1) 50%,var(--bg2)) fixed;color:var(--tx);font:15px/1.4 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none}
.layer{position:relative;z-index:1}
svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1,h2,h3{line-height:1.12;letter-spacing:-.03em}
a{color:inherit}
.mu{color:var(--tx3)}

/* ---- glass, mirror, shimmer ---- */
.glass{background:var(--glass);border:1px solid var(--stroke);border-radius:22px;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.mirror{position:relative;border-radius:26px;background:linear-gradient(135deg,#1A1A1A,#0E0E0E 55%,#141414);box-shadow:0 0 60px rgba(122,30,20,.33),0 18px 40px rgba(0,0,0,.55)}
.mirror::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;pointer-events:none;background:conic-gradient(from var(--ang),#5C0D14,#9E2D1E 24%,#D8AF63 55%,#9E2D1E 78%,#40100C 90%,#5C0D14);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 9s linear infinite}
.mirror::after{content:"";position:absolute;inset:4px;border-radius:calc(26px - 4px);border:1px solid rgba(226,188,119,.33);pointer-events:none}
@keyframes spin{to{--ang:360deg}}
.mirror>*{position:relative;z-index:1}

/* ---- controls ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border:0;border-radius:16px;font:700 15px/1 inherit;color:#fff;background:linear-gradient(135deg,#2A78F5,#1A55D4);box-shadow:0 10px 28px rgba(31,111,235,.3);cursor:pointer;text-decoration:none;position:relative;overflow:hidden}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.28) 50%,transparent 65%);transform:translateX(-120%);animation:glint 5s ease-in-out infinite}
@keyframes glint{0%,60%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.btn:active{transform:scale(.98)}
.btn.out{background:var(--glass);border:1px solid var(--stroke);box-shadow:none;font-weight:600}
.btn.out::after{display:none}
.btn.block{width:100%}
.btn svg{width:19px;height:19px}
.ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;background:rgba(91,140,255,.18);color:var(--blue)}
.ic svg{width:20px;height:20px}
.ic.mint{background:rgba(49,214,163,.16);color:var(--mint)}
.ic.org{background:rgba(255,165,75,.16);color:var(--orange)}
.ic.vio{background:rgba(120,86,234,.2);color:#A794FF}
.ic.gold{background:rgba(251,191,36,.16);color:var(--gold)}
.ic.red{background:rgba(255,94,108,.16);color:var(--red)}
.ic.round{border-radius:50%}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;font-size:12px;font-weight:700;background:rgba(49,214,163,.16);color:var(--mint)}
.chip.gold{background:rgba(251,191,36,.16);color:var(--gold)}
.chip svg{width:14px;height:14px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 0 rgba(49,214,163,.6);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(49,214,163,0)}100%{box-shadow:0 0 0 0 rgba(49,214,163,0)}}
.sec{font-size:18px;font-weight:900;letter-spacing:-.4px;display:flex;align-items:center;gap:9px;margin:10px 4px 0}
.sec::before{content:"";width:3px;height:16px;border-radius:2px;background:var(--gold)}
.sec.o::before{background:var(--orange)}.sec.m::before{background:var(--mint)}.sec.v::before{background:var(--violet)}

/* ================= MINI APP ================= */
body.web .app,body.web #tabbar,body.web .sheet{display:none}
body.tg .web{display:none}
.app{max-width:520px;margin:0 auto;padding:12px 16px calc(100px + env(safe-area-inset-bottom))}
.tab{display:flex;flex-direction:column;gap:14px;animation:in .3s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pagehead h2{font-size:30px;font-weight:900;letter-spacing:-1.1px}
.pagehead p{color:var(--tx3);margin-top:4px}

.hero{position:relative;height:270px;border-radius:26px;overflow:hidden;box-shadow:0 22px 50px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.1)}
.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:62% center;animation:kb 18s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.1) translateX(-1.5%)}}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,8,15,.15),rgba(4,8,15,0) 40%,rgba(5,9,17,.82))}
.hero .top{position:absolute;z-index:2;left:14px;right:12px;top:12px;display:flex;align-items:center;justify-content:space-between}
.mark{width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.34);border:1px solid rgba(255,255,255,.2);display:grid;place-items:center;overflow:hidden;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.mark img{width:100%;height:100%;object-fit:cover}
.gbtn{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.34);color:#fff;display:grid;place-items:center;cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.hero .bot{position:absolute;z-index:2;left:16px;right:16px;bottom:14px}
.hero .gr{font-size:15px;font-weight:600;text-shadow:0 1px 6px #000}
.hero .nm{font-size:34px;font-weight:900;letter-spacing:-1.2px;line-height:1.05;text-shadow:0 2px 16px rgba(0,0,0,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:8px;margin-top:8px;padding:6px 12px;border-radius:99px;background:rgba(0,0,0,.42);border:1px solid rgba(255,255,255,.16);font-size:12px;font-weight:700;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}

.gate{display:flex;flex-direction:column;gap:16px;padding:16px}
.gate .r{display:flex;gap:14px;align-items:center}
.gate img{width:76px;height:76px;border-radius:18px;object-fit:cover;flex:none}
.gate b{display:block;font-size:18px;font-weight:700;line-height:1.25}
.gate span{font-size:12px;color:var(--tx3)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.bal{padding:20px;cursor:pointer}
.bal .row1{display:flex;justify-content:space-between;align-items:flex-start}
.bal .brand{font-size:30px;font-weight:900;letter-spacing:-.5px}
.bal .sub{font-size:13px;color:var(--tx3);margin-top:2px}
.bal .big{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:16px 0 4px;font-size:46px;font-weight:900;letter-spacing:-1.5px;line-height:1}
.bal .big small{font-size:20px;font-weight:800;color:var(--gold);letter-spacing:0}
.bal .note{font-size:13px;color:var(--tx2);max-width:36ch}
.stats{display:flex;margin-top:16px;border-top:1px solid rgba(255,255,255,.1);padding-top:14px}
.stats>div{flex:1;min-width:0}

.stats b{display:block;font-size:20px;font-weight:800}
.stats span{font-size:12px;color:var(--tx3)}
.skel{height:48px;border-radius:14px;background:linear-gradient(90deg,rgba(255,255,255,.06),rgba(255,255,255,.14),rgba(255,255,255,.06));background-size:200% 100%;animation:sk 1.3s infinite}
@keyframes sk{to{background-position:-200% 0}}

.hs{display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:4px 16px 8px;scroll-snap-type:x mandatory;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.tcard{flex:none;width:236px;scroll-snap-align:start;overflow:hidden;cursor:pointer;padding:0;text-align:left;color:inherit;font:inherit}
.tcard .im{position:relative;height:126px}
.tcard .im img{width:100%;height:100%;object-fit:cover;display:block}
.tcard .im::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(5,9,17,.7))}
.tcard .im .chip{position:absolute;left:10px;top:10px;z-index:1;background:rgba(0,0,0,.5);color:#fff;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.tcard .tb{padding:12px 14px 14px}
.tcard b{display:block;font-size:15px;font-weight:700;line-height:1.25;min-height:38px}
.tcard .m{display:flex;justify-content:space-between;margin-top:8px;font-size:13px;color:var(--tx3)}
.tcard .m em{font-style:normal;color:var(--mint);font-weight:800}
.world{position:relative;overflow:hidden;border-radius:24px;min-height:170px;padding:18px;display:flex;flex-direction:column;justify-content:flex-end;gap:12px;box-shadow:0 0 0 1px rgba(255,255,255,.12)}
.world>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.world::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,8,15,.1),rgba(4,8,15,.88))}
.world>*:not(img){position:relative;z-index:1}
.world b{font-size:21px;font-weight:900;letter-spacing:-.6px}

.rowc{display:flex;align-items:center;gap:14px;padding:14px;cursor:pointer;width:100%;text-align:left;color:inherit;font:inherit;border:0}
.rowc .g{flex:1;min-width:0}
.rowc b{display:block;font-size:15px;font-weight:700}
.rowc span.d{font-size:13px;color:var(--tx3)}
.rowc .go{color:var(--tx3);width:18px;height:18px}
.field{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09)}
.field .k{font-size:12px;color:var(--tx3)}
.field b{display:block;font-size:15px;font-weight:600;color:var(--tx2)}
.field .lk{margin-left:auto;color:var(--tx3);width:18px;height:18px}
.stack{display:flex;flex-direction:column;gap:10px}

.who{display:flex;align-items:center;gap:16px;padding:18px}
.ava{width:68px;height:68px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:28px;font-weight:800;background:linear-gradient(135deg,#5C0D14,#9E2D1E 55%,#D8AF63);overflow:hidden;box-shadow:0 0 0 3px rgba(216,175,99,.4)}
.ava img{width:100%;height:100%;object-fit:cover}
.who h2{font-size:22px;font-weight:800;letter-spacing:-.6px}
.idb{display:inline-flex;align-items:center;gap:7px;margin-top:8px;padding:5px 11px;border-radius:10px;background:rgba(0,0,0,.3);border:1px solid var(--stroke);font-size:12px;color:var(--tx3);cursor:pointer}
.idb svg{width:13px;height:13px}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px}
.kv+.kv{border-top:1px solid rgba(255,255,255,.08)}
.kv .k{color:var(--tx3)}
.seg{display:inline-flex;border:1px solid var(--stroke);border-radius:12px;overflow:hidden}
.seg button{background:none;border:0;color:var(--tx3);padding:8px 13px;font:700 12px/1 inherit;cursor:pointer}
.seg button.on{background:rgba(216,175,99,.22);color:#fff}
.link{padding:12px 14px;border-radius:14px;background:rgba(0,0,0,.4);border:1px dashed rgba(226,188,119,.4);font-size:13px;word-break:break-all;color:#E2BC77}
.banner{display:flex;gap:14px;align-items:center;padding:16px;border-radius:22px;background:linear-gradient(135deg,rgba(216,175,99,.16),rgba(158,45,30,.16));border:1px solid rgba(226,188,119,.32)}
.banner b{display:block;font-size:16px;font-weight:800}
.banner span{font-size:13px;color:var(--tx2)}
.card{padding:16px}

/* wallet */
.whead{display:flex;align-items:center;gap:14px}
.whead h2{font-size:22px;font-weight:800}
.acts{display:flex;justify-content:space-between;padding:6px 4px}
.act{display:flex;flex-direction:column;align-items:center;gap:10px;width:76px;background:none;border:0;color:var(--tx);font:600 12px/1.2 inherit;text-align:center;cursor:pointer}
.shape{width:64px;height:64px;display:grid;place-items:center;position:relative;background:rgba(255,255,255,.09);border:1px solid var(--stroke)}
.shape.c{border-radius:50%}
.shape.r{border-radius:22px}
.shape.h{border:0;background:var(--stroke);clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%)}
.shape.h::before{content:"";position:absolute;inset:1px;background:#14161c;clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%)}
.shape.d{border-radius:16px;transform:rotate(45deg);width:54px;height:54px;margin:5px}
.shape.d svg{transform:rotate(-45deg)}
.shape svg{position:relative;z-index:1;width:26px;height:26px}
.hist{padding:22px 16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}

/* referral */
.refhero{padding:24px 20px;text-align:center}
.refhero .lab{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3)}
.refhero .big{font-size:56px;font-weight:900;letter-spacing:-2px;line-height:1;margin:10px 0 6px}
.refhero .big small{font-size:24px;color:var(--gold);letter-spacing:0}
.refhero p{color:var(--tx2);font-size:14px}
.stat{padding:16px;display:flex;flex-direction:column;gap:6px;position:relative;min-width:0}
.stat b{font-size:34px;font-weight:900;letter-spacing:-1px;line-height:1}
.stat span.l{font-size:12px;color:var(--tx3)}
.stat .plus{position:absolute;right:12px;top:14px;font-style:normal;font-weight:800;color:var(--gold);background:rgba(216,175,99,.14);border:1px solid rgba(226,188,119,.3);padding:4px 10px;border-radius:99px;font-size:13px}
.share{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 8px}
.share button{display:flex;flex-direction:column;align-items:center;gap:7px;background:none;border:0;color:var(--tx2);font:600 11px/1.2 inherit;cursor:pointer}
.share .b{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;font:900 19px/1 inherit;color:#fff;box-shadow:0 8px 18px rgba(0,0,0,.35)}
.share .b svg{width:24px;height:24px}
.share button:active .b{transform:scale(.94)}
.num{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:14px;color:#1a1206;background:linear-gradient(135deg,#F6E7C4,#D8AF63);flex:none}
/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;padding:8px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.75) 40%)}
.tabbar .in{display:flex;width:100%;max-width:496px;padding:6px;border-radius:26px;background:rgba(13,17,23,.82);border:1px solid var(--stroke);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:0 12px 40px rgba(0,0,0,.5)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 7px;background:none;border:0;border-radius:20px;color:var(--tx3);font:600 11px/1 inherit;cursor:pointer;transition:.2s}
.tabbar button.on{color:#fff;background:rgba(216,175,99,.14);box-shadow:inset 0 0 0 1px rgba(226,188,119,.32)}
.sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:rgba(2,4,10,.6);opacity:0;pointer-events:none;transition:.25s;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.sheet.on{opacity:1;pointer-events:auto}
.sheet .p{width:100%;max-width:520px;padding:22px 20px calc(22px + env(safe-area-inset-bottom));border-radius:28px 28px 0 0;background:#0D1117;border:1px solid var(--stroke);border-bottom:0;transform:translateY(40px);transition:.3s;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}
.sheet.on .p{transform:none}
.sheet .p h3{font-size:21px;font-weight:900}
.sheet .p p{color:var(--tx2);font-size:14px;max-width:36ch}
.toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#fff;color:#07101f;padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:80}
.toast.on{opacity:1;transform:translateX(-50%)}

/* ================= WEBSITE ================= */
.wrap{max-width:1100px;margin:0 auto;padding:0 22px}
.nav{display:flex;align-items:center;justify-content:space-between;padding:18px 0}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:21px;letter-spacing:-.04em;text-decoration:none}
.logo img{width:36px;height:36px;border-radius:50%}
.brandrow{display:flex;align-items:center;gap:14px}.by{display:flex;align-items:center;gap:7px;padding-left:14px;border-left:1px solid rgba(255,255,255,.16);color:var(--tx3);font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap}.by img{width:22px;height:22px;object-fit:contain}.by:hover{color:var(--tx)}
.nav .r{display:flex;align-items:center;gap:10px}
.wh{display:grid;grid-template-columns:1.05fr .95fr;gap:36px;align-items:center;padding:34px 0 70px}
.wh h1{font-size:clamp(34px,5.4vw,60px);font-weight:900;letter-spacing:-.045em;margin-bottom:18px}
.wh h1 em{font-style:normal;background:linear-gradient(120deg,#F6E7C4,#D8AF63 50%,#E8C98A);-webkit-background-clip:text;background-clip:text;color:transparent}
.wh .lead{font-size:18px;color:var(--tx2);max-width:46ch;margin-bottom:26px}
.wh .cta{display:flex;gap:12px;flex-wrap:wrap}
.wh .btn{min-height:56px;padding:0 26px;font-size:16px}
.stage{display:flex;justify-content:center}
.dl{display:flex;flex-direction:column;gap:12px;padding:22px}.dl h3{font-size:20px;font-weight:800}.dl p{color:var(--tx3);font-size:14px}
.phone{width:290px;border-radius:44px;padding:9px;background:linear-gradient(135deg,#5C0D14,#9E2D1E 28%,#D8AF63 62%,#40100C);box-shadow:0 0 90px rgba(122,30,20,.5),0 40px 80px rgba(0,0,0,.7);transform:rotate(2.5deg)}
.phone .scr{border-radius:36px;background:linear-gradient(180deg,#060A14,#0A1020 60%,#000);padding:14px 12px 78px;position:relative;overflow:hidden;min-height:590px;display:flex;flex-direction:column;gap:12px;pointer-events:none}
.phone .hero{height:190px;border-radius:22px}
.phone .hero .nm{font-size:26px}
.phone .mirror{border-radius:22px}
.phone .bal{padding:14px}
.phone .bal .brand{font-size:22px}.phone .bal .big{font-size:36px;margin:10px 0 2px}
.phone .tabbar{position:absolute;padding:0 8px 10px;display:flex}
.phone .tabbar .in{padding:4px;border-radius:20px}
.phone .tabbar button{padding:6px 0 5px;font-size:10px}
.phone .tabbar svg{width:20px;height:20px}
.ws{padding:56px 0}
.ws>h2{font-size:clamp(26px,3.8vw,40px);font-weight:900;margin-bottom:10px}
.ws>p.sub{color:var(--tx3);margin-bottom:28px;max-width:60ch}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.feat{display:flex;flex-direction:column;gap:12px;padding:22px}
.feat h3{font-size:18px;font-weight:800}
.feat p{color:var(--tx3);font-size:14px}
.feat .n{font-size:46px;font-weight:900;letter-spacing:-.05em;background:linear-gradient(120deg,#F6E7C4,#D8AF63);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}

}

function sheet(kind){
  const k=kind==='money'?'money':kind==='feed'?'feed':'app';
  $('#shT').textContent=t('sh_'+k+'_t');$('#shD').textContent=t('sh_'+k+'_d');
  $('#sheet').classList.add('on');haptic();
}
document.addEventListener('click',e=>{
  if(e.target===$('#sheet')||e.target.closest('#shX')){$('#sheet').classList.remove('on');return}
  const el=e.target.closest('[data-go],[data-open],[data-site],[data-bot],[data-copy],[data-share],[data-lang],[data-sheet],[data-sh]');
  if(!el)return;
  if(el.dataset.lang){lang=el.dataset.lang;store.set('lvs_lang',lang);applyLang();return}
  if(el.dataset.sheet){sheet(el.dataset.sheet);return}
  if(el.dataset.sh){haptic();share(el.dataset.sh);return}
  if(el.dataset.go!==undefined){go(el.dataset.go);return}
  if(el.dataset.open){openUrl(el.dataset.open);return}
  if(el.dataset.site){$('#sheet').classList.remove('on');openSite(el.dataset.site);return}
  if(el.dataset.bot!==undefined){
    if(el.tagName==='A')e.preventDefault();
    $('#sheet').classList.remove('on');
    openUrl(el.dataset.bot==='app'?botUrl('app'):botStart());return}
  if(el.dataset.copy){copy(el.dataset.copy);return}
  if(el.dataset.share){
    const text=lang==='ru'?'Заходи в LVS — задания рядом, оплата за результат. Тебе подарок: 10 BON.':'Join LVS — tasks nearby, paid for the result. A gift for you: 10 BON.';
    openUrl('https://t.me/share/url?url='+encodeURIComponent(el.dataset.share)+'&text='+encodeURIComponent(text));
  }
});

async function loadMe(){
  if(!inTg)return;
  try{
    const c=new AbortController();const to=setTimeout(()=>c.abort(),6000);
    const r=await fetch(API+'/blob/bonus/miniapp/me',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({init_data:tg.initData}),signal:c.signal});
    clearTimeout(to);
    if(!r.ok)throw new Error(r.status);
    me=await r.json();
  }catch(e){me=null}
  renderAll();
}

/* ---------- living background (stars, gems, rings; breathing glow; tap ripples) ---------- */
function startBg(){
  const c=$('#bg'),g=c.getContext('2d');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let w,h,dpr,parts=[],ripples=[],raf=0,last=0;
  const cols=['245,235,215','226,188,119','255,255,255','160,185,255'];
  function size(){dpr=Math.min(window.devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;g.setTransform(dpr,0,0,dpr,0,0);
    const n=w<600?34:64;parts=[];for(let i=0;i<n;i++)parts.push(mk(true))}
  function mk(init){const r=Math.random();return{x:Math.random()*w,y:init?Math.random()*h:h+20,kind:r<.5?0:r<.8?1:2,s:4+Math.random()*9,rot:Math.random()*6.28,vr:(Math.random()-.5)*.0006,
    vy:-(.006+Math.random()*.018),vx:(Math.random()-.5)*.01,ph:Math.random()*6.28,sp:.0006+Math.random()*.0016,col:cols[Math.random()<.7?0:1+Math.floor(Math.random()*3)],ix:0,iy:0}}
  function star(p,a){g.strokeStyle='rgba('+p.col+','+a+')';g.lineWidth=1;g.beginPath();
    g.moveTo(p.x-p.s,p.y);g.lineTo(p.x+p.s,p.y);g.moveTo(p.x,p.y-p.s*1.5);g.lineTo(p.x,p.y+p.s*1.5);
    const d=p.s*.55;g.moveTo(p.x-d,p.y-d);g.lineTo(p.x+d,p.y+d);g.moveTo(p.x-d,p.y+d);g.lineTo(p.x+d,p.y-d);g.stroke()}
  function gem(p,a){g.save();g.translate(p.x,p.y);g.rotate(p.rot);g.strokeStyle='rgba('+p.col+','+a+')';g.lineWidth=1;
    const s=p.s;g.beginPath();g.moveTo(0,-s);g.lineTo(s*.8,0);g.lineTo(0,s);g.lineTo(-s*.8,0);g.closePath();g.moveTo(-s*.8,0);g.lineTo(s*.8,0);g.moveTo(0,-s);g.lineTo(0,s);g.stroke();g.restore()}
  function ring(p,a){g.strokeStyle='rgba('+p.col+','+a+')';g.lineWidth=1;g.beginPath();g.arc(p.x,p.y,p.s,0,6.283);g.stroke()}
  function frame(now){
    raf=requestAnimationFrame(frame);
    if(now-last<33)return;const dt=Math.min(now-last,80);last=now;
    g.clearRect(0,0,w,h);
    const k=(Math.sin(now/6500)+1)/2;
    let gr=g.createRadialGradient(w*(.15+.6*k),h*.18,0,w*(.15+.6*k),h*.18,Math.max(w,h)*.75);
    gr.addColorStop(0,'rgba(216,175,99,'+(.05+.03*k)+')');gr.addColorStop(1,'rgba(216,175,99,0)');g.fillStyle=gr;g.fillRect(0,0,w,h);
    gr=g.createRadialGradient(w*(.85-.55*k),h*.88,0,w*(.85-.55*k),h*.88,Math.max(w,h)*.7);
    gr.addColorStop(0,'rgba(158,45,30,'+(.14+.05*(1-k))+')');gr.addColorStop(1,'rgba(158,45,30,0)');g.fillStyle=gr;g.fillRect(0,0,w,h);
    for(const p of parts){
      p.x+=p.vx*dt+p.ix;p.y+=p.vy*dt+p.iy;p.rot+=p.vr*dt;p.ix*=.92;p.iy*=.92;
      if(p.y<-24||p.x<-24||p.x>w+24){Object.assign(p,mk(false),{x:Math.random()*w})}
      const a=.18+.55*(.5+.5*Math.sin(now*p.sp+p.ph));
      p.kind===0?star(p,a):p.kind===1?gem(p,a*.9):ring(p,a*.7);
    }
    for(let i=ripples.length-1;i>=0;i--){const r=ripples[i];r.t+=dt;const f=r.t/900;if(f>=1){ripples.splice(i,1);continue}
      g.strokeStyle='rgba(226,188,119,'+(.5*(1-f))+')';g.lineWidth=1.5;g.beginPath();g.arc(r.x,r.y,10+f*110,0,6.283);g.stroke();
      for(const p of parts){const dx=p.x-r.x,dy=p.y-r.y,d=Math.hypot(dx,dy);if(d<140&&d>1){p.ix+=dx/d*.05*(1-f);p.iy+=dy/d*.05*(1-f)}}}
  }
  function still(){g.clearRect(0,0,w,h);const gr=g.createRadialGradient(w*.5,h*.2,0,w*.5,h*.2,Math.max(w,h)*.75);gr.addColorStop(0,'rgba(216,175,99,.07)');gr.addColorStop(1,'rgba(216,175,99,0)');g.fillStyle=gr;g.fillRect(0,0,w,h);
    for(const p of parts){const a=.4;p.kind===0?star(p,a):p.kind===1?gem(p,a):ring(p,a*.7)}}
  size();
  addEventListener('resize',()=>{size();if(reduce)still()});
  if(reduce){still();return}
  addEventListener('pointerdown',e=>{ripples.push({x:e.clientX,y:e.clientY,t:0})},{passive:true});
  document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(raf)}else{last=0;raf=requestAnimationFrame(frame)}});
  raf=requestAnimationFrame(frame);
}

/* ---------- start ---------- */
if(appMode){
  $('#tabbar').style.display='flex';
  if(tg){try{tg.ready();tg.expand();tg.setHeaderColor('#060A14');tg.setBackgroundColor('#060A14');if(tg.setBottomBarColor)tg.setBottomBarColor('#000000');
    if(tg.BackButton)tg.BackButton.onClick(()=>go(cur==='ref'?'me':'home'))}catch(e){}}
}
applyLang();
startBg();
loadMe();
})();
</script>
