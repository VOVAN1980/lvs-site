  <!-- The LVS splash: shown at once, before the app has downloaded, and
       faded out on the app's first frame (owner 25.10: no white window). -->
  <style>
    html, body { margin: 0; height: 100%; background: #020716; }
    #lvs-splash { position: fixed; inset: 0; z-index: 9999; display: flex;
      flex-direction: column; align-items: center; justify-content: center; gap: 26px;
      background: radial-gradient(circle at 50% 44%, #0b2a66 0%, #04102b 36%, #020716 72%);
      transition: opacity .45s ease; }
    #lvs-splash.gone { opacity: 0; pointer-events: none; }
    .lvs-spin { position: relative; width: 168px; height: 168px; }
    .lvs-ring { position: absolute; inset: 0; border-radius: 50%;
      background: conic-gradient(from 0deg, transparent 0 52%, #2f8bff 74%, #7fe9ff 93%, transparent 100%);
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
      mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
      filter: drop-shadow(0 0 10px rgba(80, 180, 255, .9));
      animation: lvs-swing 2.6s cubic-bezier(.65, 0, .35, 1) infinite alternate; }
    .lvs-ring.inner { inset: 15px; opacity: .9; animation-duration: 2.1s;
      animation-direction: alternate-reverse;
      background: conic-gradient(from 180deg, transparent 0 58%, #18d3c6 82%, #eafcff 96%, transparent 100%); }
    .lvs-mark { position: absolute; left: 38px; top: 38px; width: 92px; height: 92px;
      filter: drop-shadow(0 0 18px rgba(60, 150, 255, .85));
      animation: lvs-breath 2.6s ease-in-out infinite; }
    .lvs-word { font: 800 22px/1 "Segoe UI", Roboto, Arial, sans-serif; letter-spacing: 9px;
      padding-left: 9px; color: #cfe3ff; text-shadow: 0 0 14px rgba(80, 170, 255, .7); }
    @keyframes lvs-swing { from { transform: rotate(0deg); } to { transform: rotate(540deg); } }
    @keyframes lvs-breath { 0%, 100% { transform: scale(.93); } 50% { transform: scale(1.05); } }
  </style>

    window.addEventListener('flutter-first-frame', () => {
      const splash = document.getElementById('lvs-splash');
      if (!splash) return;
      splash.classList.add('gone');
      setTimeout(() => splash.remove(), 500);
    });
    // Every frame is drawn by the phone's graphics chip at the screen's full
    // density; on the owner's phone (2.75) a fifth of the time went to
    // waiting for it while scrolling (26.10.2026). Drawn at 2 at most, the
    // chip has about half the pixels to fill.
    (() => {
      const density = Object.getOwnPropertyDescriptor(window, 'devicePixelRatio');
      if (!density || !density.get) return;
      Object.defineProperty(window, 'devicePixelRatio', {
        configurable: true,
        get: () => Math.min(2, density.get.call(window)),
      });
    })();

          if (!sessionStorage.getItem(oneTime)) return;
          wipe(sessionStorage);
          wipe(persistent);
          if (ownStorage) Object.defineProperty(window, 'localStorage', ownStorage);
          else delete window.localStorage;
        },
      };
      const answer = (ask) => new Promise((resolve) => {
        setTimeout(() => resolve(null), 4000);
        try { ask(resolve); } catch (_) { resolve(null); }
      });
      window.lvsSecretsReady = (async () => {
        const storage = inTelegram && tg.isVersionAtLeast('9.0') &&
          !sessionStorage.getItem(oneTime) ? tg.SecureStorage : null;
        if (!storage) return;
        const read = await answer((done) => storage.getItem(item,
          (error, value, canRestore) => done({ error, value, canRestore })));
        // No answer or an error: this Telegram (for PC) has no secure storage.
        if (!read || read.error) return;
        let value = read.value;
        if (!value && read.canRestore) {
          const restored = await answer((done) => storage.restoreItem(item,
            (error, saved) => done({ error, value: saved })));
          value = restored && !restored.error ? restored.value : null;
        }
        try {
          const saved = value ? JSON.parse(value) : null;
          // A cleared item may contain JSON "null", which parses successfully
          // but is not a key map. Keep valid maps unchanged on reopening.
          keys.map = saved && typeof saved === 'object' && !Array.isArray(saved)

      })();

        get(name) {
          if (!keys.secure) return localStorage.getItem(name);

          // A key kept by this browser before: it moves to Telegram's storage.
          if (keys.map[name] == null && old) window.lvsSecrets.set(name, old);
          return keys.map[name] == null ? null : keys.map[name];
        },
        remove(name) {
          localStorage.removeItem(name);
          if (!keys.secure || keys.map[name] == null) return;
          delete keys.map[name];
          tg.SecureStorage.setItem(item, JSON.stringify(keys.map));
        },
        set(name, value) {
          if (!keys.secure) { localStorage.setItem(name, value); return; }
          keys.map[name] = value;
          tg.SecureStorage.setItem(item, JSON.stringify(keys.map), (error) => {
            // Kept in the browser only while Telegram did not take it.
            if (error) localStorage.setItem(name, value);
            else localStorage.removeItem(name);
          });
        },
      };
    })(); } catch (error) {
      window.lvsBootErrors.push(String((error && error.stack) || error).slice(0, 300));
    }
  </script>
  <!-- The Mini App's LVS core (WebAssembly, built from web-core) starts
       first; the app's screens find it as window.lvsCore. -->
  <script type="module">
    if (!window.lvsLeaving) {
      const { default: init, openRuntime, callRuntime, closeRuntime, call } =
        await import('./lvs_core/lvs_core.js');
      await Promise.all([init(), window.lvsSecretsReady]);
      window.lvsCore = { openRuntime, callRuntime, closeRuntime, call };
      const flutter = document.createElement('script');
      flutter.src = 'flutter_bootstrap.js';
      document.body.appendChild(flutter);
    }
